<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Event Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #090d16;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      margin-top: 8px;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 2px 0;
      text-align: center;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Live Info Panel */
    .info-panel {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      text-align: center;
    }

    .info-item .label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-item .value {
      font-size: 0.85rem;
      font-weight: 600;
      color: #38bdf8;
      margin-top: 2px;
    }

    .info-full {
      grid-column: span 2;
      border-top: 1px solid var(--border);
      padding-top: 4px;
      margin-top: 2px;
    }

    #reader {
      width: 100% !important;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border) !important;
      background: #000;
    }
    
    #reader video {
      object-fit: cover;
    }

    #status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
      display: none;
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .status-success {
      background: #064e3b;
      color: #34d399;
      border: 1px solid #059669;
    }

    .status-error {
      background: #7f1d1d;
      color: #f87171;
      border: 1px solid #dc2626;
    }

    .manual-section {
      margin-top: 14px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      background: #0f172a;
      color: var(--text);
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn-submit:active {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

<div class="app-card">
  <h1>Event Scanner</h1>
  <p class="subtitle">Oct 8 & 9, 2026</p>

  <div class="info-panel">
    <div class="info-item">
      <div class="label">Date</div>
      <div class="value" id="currentDate">--</div>
    </div>
    <div class="info-item">
      <div class="label">Time</div>
      <div class="value" id="currentTime">--</div>
    </div>
    <div class="info-item info-full">
      <div class="label">Active Mode</div>
      <div class="value" id="currentStage">Checking schedule...</div>
    </div>
  </div>

  <div id="reader"></div>
  <div id="status"></div>

  <div class="manual-section">
    <label for="manualId">Manual ID Entry</label>
    <div class="input-group">
      <input type="text" id="manualId" placeholder="Enter ID..." autocomplete="off" autocapitalize="characters">
      <button class="btn-submit" onclick="submitManual()">Submit</button>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFFd-YQtvlnIHTzSBAo31FCzlfXpAGfZEX4gZoyXmbU-5F734GyP69hwSerbCR0dOO3g/exec";

  let isProcessing = false;
  let lastScannedId = "";
  let lastScanTime = 0;
  const SCAN_COOLDOWN = 3000; // 3 seconds fast cooldown

  // Fast Audio Feedback Synthesizer
  function playSound(type) {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'success') {
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // A5
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
      }
    } catch (e) {
      console.log("Audio skipped", e);
    }
  }

  // Live Dashboard Clock & Stage Matcher
  function updateClockAndStage() {
    const now = new Date();
    document.getElementById('currentDate').innerText = now.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('currentTime').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    const year = now.getFullYear();
    const month = now.getMonth();
    const day = now.getDate();
    const timeDecimal = now.getHours() + (now.getMinutes() / 60);

    let stageText = "Check-In / Arrival Mode";

    if (year === 2026 && month === 9) {
      if (day === 8) {
        if (timeDecimal >= 11.5 && timeDecimal < 16.0) stageText = "Day 1 Lunch Active";
        else if (timeDecimal >= 18.0 && timeDecimal < 22.0) stageText = "Day 1 Dinner Active";
      } else if (day === 9) {
        if (timeDecimal >= 7.5 && timeDecimal < 11.0) stageText = "Day 2 Breakfast Active";
        else if (timeDecimal >= 11.5 && timeDecimal < 16.0) stageText = "Day 2 Lunch Active";
        else if (timeDecimal >= 18.0 && timeDecimal < 22.0) stageText = "Day 2 Dinner Active";
      }
    }
    document.getElementById('currentStage').innerText = stageText;
  }

  setInterval(updateClockAndStage, 1000);
  updateClockAndStage();

  function showStatus(message, isSuccess) {
    const statusDiv = document.getElementById('status');
    statusDiv.innerText = message;
    statusDiv.className = isSuccess ? 'status-success' : 'status-error';
    statusDiv.style.display = 'block';
    playSound(isSuccess ? 'success' : 'error');
  }

  function handleScan(scannedId) {
    if (!scannedId) return;
    const cleanId = scannedId.trim().toUpperCase();
    const now = Date.now();

    if (cleanId === lastScannedId && (now - lastScanTime < SCAN_COOLDOWN)) {
      return; // Cooldown active
    }

    if (isProcessing) return;
    isProcessing = true;

    lastScannedId = cleanId;
    lastScanTime = now;

    showStatus(`Verifying ${cleanId}...`, true);

    // Call backend and read authoritative JSON response
    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8',
      },
      body: JSON.stringify({ 
        scannedId: cleanId, 
        timestamp: new Date().toISOString() 
      })
    })
    .then(response => response.json())
    .then(result => {
      showStatus(result.message, result.success);
      setTimeout(() => {
        document.getElementById('status').style.display = 'none';
        isProcessing = false;
      }, 2500); // Quick reset for fast scanning lines
    })
    .catch(err => {
      console.error("Error:", err);
      showStatus("Connection error. Try again.", false);
      setTimeout(() => {
        document.getElementById('status').style.display = 'none';
        isProcessing = false;
      }, 2500);
    });
  }

  function submitManual() {
    const input = document.getElementById('manualId');
    const val = input.value.trim();
    if (val !== "") {
      handleScan(val);
      input.value = "";
    }
  }

  // Initialize QR Camera Scanner optimized for mobile viewfinders
  const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
    fps: 15, 
    qrbox: { width: 200, height: 200 },
    aspectRatio: 1.0
  }, false);
  
  html5QrcodeScanner.render((decodedText) => {
    handleScan(decodedText);
  }, (error) => {});
</script>

</body>
</html>
