<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>WPF26 Scanner</title>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>


<style>

* {
  box-sizing: border-box;
}


html,
body {

  margin: 0;

  padding: 0;

  min-height: 100%;

  background: #101010;

  color: #ffffff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


body {

  padding: 12px;

}


.container {

  width: 100%;

  max-width: 520px;

  margin:
    0 auto;

}


/*******************************************************
 * HEADER
 *******************************************************/

.header {

  text-align: center;

  padding:
    8px 0 12px;

}


.header h1 {

  margin: 0;

  font-size: 23px;

  line-height: 1.2;

}


.header p {

  margin:
    5px 0 0;

  font-size: 12px;

  opacity: 0.55;

}


/*******************************************************
 * ACTIVE FOOD
 *******************************************************/

.food-panel {

  margin-bottom: 10px;

  padding:
    13px 10px;

  border-radius: 12px;

  text-align: center;

  background: #202020;

}


.food-label {

  font-size: 11px;

  text-transform: uppercase;

  letter-spacing: 1px;

  opacity: 0.55;

}


.food-name {

  margin-top: 3px;

  font-size: 22px;

  font-weight: bold;

}


.food-state {

  margin-top: 3px;

  font-size: 12px;

  opacity: 0.65;

}


/*******************************************************
 * SCANNER
 *******************************************************/

.scanner-card {

  padding: 10px;

  border-radius: 15px;

  background: #1b1b1b;

}


#reader {

  width: 100%;

  overflow: hidden;

  border-radius: 11px;

}


#reader video {

  width: 100% !important;

  height: auto !important;

  border-radius: 11px;

}


/*******************************************************
 * STATUS
 *******************************************************/

.status {

  min-height: 84px;

  margin-top: 10px;

  padding: 13px;

  border-radius: 11px;

  background: #292929;

  text-align: center;

  display: flex;

  flex-direction: column;

  justify-content: center;

  gap: 5px;

}


.status-title {

  font-size: 20px;

  font-weight: bold;

}


.status-message {

  font-size: 13px;

  opacity: 0.85;

}


/*******************************************************
 * STATUS TYPES
 *******************************************************/

.status.success {

  background: #123d24;

}


.status.warning {

  background: #493a10;

}


.status.error {

  background: #491b1b;

}


.status.processing {

  background: #18364b;

}


/*******************************************************
 * ATTENDEE
 *******************************************************/

.attendee {

  display: none;

  margin-top: 9px;

  padding: 11px;

  border-radius: 10px;

  background: #242424;

  text-align: center;

}


.attendee-name {

  font-size: 19px;

  font-weight: bold;

}


.attendee-id {

  margin-top: 3px;

  font-size: 12px;

  opacity: 0.55;

}


/*******************************************************
 * MANUAL ENTRY
 *******************************************************/

.manual {

  margin-top: 10px;

  padding: 11px;

  border-radius: 15px;

  background: #1b1b1b;

}


.manual-title {

  margin-bottom: 7px;

  font-size: 12px;

  opacity: 0.55;

}


.manual-row {

  display: flex;

  gap: 7px;

}


.manual input {

  flex: 1;

  min-width: 0;

  padding: 12px;

  border: none;

  outline: none;

  border-radius: 8px;

  background: #292929;

  color: #ffffff;

  font-size: 16px;

  text-transform: uppercase;

}


.manual button {

  padding:
    0 16px;

  border: none;

  border-radius: 8px;

  background: #ffffff;

  color: #000000;

  font-size: 13px;

  font-weight: bold;

}


.manual button:active {

  transform:
    scale(0.97);

}


/*******************************************************
 * FOOTER
 *******************************************************/

.last-scan {

  min-height: 16px;

  margin-top: 7px;

  text-align: center;

  font-size: 11px;

  opacity: 0.35;

}


.footer {

  padding:
    10px 0;

  text-align: center;

  font-size: 10px;

  opacity: 0.25;

}

</style>

</head>


<body>


<div class="container">


  <!-- HEADER -->

  <div class="header">

    <h1>
      WORLD PEACE FESTIVAL
    </h1>

    <p>
      2026 • Attendance Scanner
    </p>

  </div>


  <!-- CURRENT FOOD -->

  <div class="food-panel">

    <div class="food-label">
      CURRENT FOOD
    </div>

    <div
      id="foodName"
      class="food-name"
    >
      CHECK-IN ONLY
    </div>

    <div
      id="foodState"
      class="food-state"
    >
      No food service is currently active
    </div>

  </div>


  <!-- SCANNER -->

  <div class="scanner-card">

    <div id="reader"></div>


    <!-- STATUS -->

    <div
      id="status"
      class="status"
    >

      <div
        id="statusTitle"
        class="status-title"
      >
        READY
      </div>

      <div
        id="statusMessage"
        class="status-message"
      >
        Scan attendee QR code
      </div>

    </div>


    <!-- ATTENDEE -->

    <div
      id="attendee"
      class="attendee"
    >

      <div
        id="attendeeName"
        class="attendee-name"
      ></div>

      <div
        id="attendeeId"
        class="attendee-id"
      ></div>

    </div>


    <div
      id="lastScan"
      class="last-scan"
    ></div>

  </div>


  <!-- MANUAL ID -->

  <div class="manual">

    <div class="manual-title">
      MANUAL ID ENTRY
    </div>


    <div class="manual-row">

      <input
        id="manualId"
        type="text"
        placeholder="Enter attendee ID"
        autocomplete="off"
        autocapitalize="characters"
      >


      <button
        id="manualButton"
        type="button"
      >
        SUBMIT
      </button>

    </div>

  </div>


  <div class="footer">

    Scanner controlled by Google Sheet

  </div>


</div>


<script>

/*******************************************************
 * CONFIGURATION
 *******************************************************/

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzFFd-YQtvlnIHTzSBAo31FCzlfXpAGfZEX4gZoyXmbU-5F734GyP69hwSerbCR0dOO3g/exec";


/*
 * How often the frontend checks the spreadsheet
 * for the current food header.
 */

const FOOD_REFRESH_MS =
  5000;


/*
 * Local duplicate protection.
 *
 * Backend has the real protection.
 */

const LOCAL_COOLDOWN_MS =
  2500;


/*******************************************************
 * STATE
 *******************************************************/

let processing =
  false;


let lastScannedId =
  "";


let lastScanTime =
  0;


let activeFood =
  "";


let audioContext =
  null;


/*******************************************************
 * STATUS
 *******************************************************/

function setStatus(
  title,
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  document.getElementById(
    "statusTitle"
  ).textContent =
    title;


  document.getElementById(
    "statusMessage"
  ).textContent =
    message;


  status.className =
    "status " +
    (
      type || ""
    );

}


/*******************************************************
 * SHOW ATTENDEE
 *******************************************************/

function showAttendee(
  id,
  name
) {

  const box =
    document.getElementById(
      "attendee"
    );


  document.getElementById(
    "attendeeName"
  ).textContent =
    name ||
    "Attendee";


  document.getElementById(
    "attendeeId"
  ).textContent =
    id;


  box.style.display =
    "block";

}


/*******************************************************
 * HIDE ATTENDEE
 *******************************************************/

function hideAttendee() {

  document.getElementById(
    "attendee"
  ).style.display =
    "none";

}


/*******************************************************
 * UPDATE LAST SCAN
 *******************************************************/

function updateLastScan(
  id
) {

  document.getElementById(
    "lastScan"
  ).textContent =
    "Last scan: " +
    id;

}


/*******************************************************
 * CLEAN ID
 *******************************************************/

function cleanId(
  value
) {

  return String(
    value || ""
  )
    .trim()
    .replace(/\s+/g, "")
    .toUpperCase();

}


/*******************************************************
 * AUDIO
 *******************************************************/

function playSound(
  type
) {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(
      gain
    );


    gain.connect(
      audioContext.destination
    );


    if (
      type === "success"
    ) {

      oscillator.frequency.value =
        900;

    } else if (
      type === "warning"
    ) {

      oscillator.frequency.value =
        450;

    } else {

      oscillator.frequency.value =
        250;

    }


    gain.gain.setValueAtTime(
      0.001,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.15,
      audioContext.currentTime + 0.01
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime + 0.15
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.16
    );

  } catch (error) {

    /*
     * Audio must never interfere with scanning.
     */

  }

}


/*******************************************************
 * VIBRATION
 *******************************************************/

function vibrate(
  pattern
) {

  try {

    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        pattern
      );

    }

  } catch (error) {}

}


/*******************************************************
 * READ CURRENT FOOD
 *******************************************************/

async function refreshFood() {

  try {

    const response =
      await fetch(
        SCRIPT_URL +
        "?t=" +
        Date.now(),
        {

          method:
            "GET",

          cache:
            "no-store"

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    if (
      !result.success
    ) {

      return;

    }


    const food =
      String(
        result.activeFood ||
        ""
      ).trim();


    /*
     * No food column.
     */

    if (!food) {

      activeFood =
        "";


      document.getElementById(
        "foodName"
      ).textContent =
        "CHECK-IN ONLY";


      document.getElementById(
        "foodState"
      ).textContent =
        "No food service is currently active";


      return;

    }


    /*
     * Food column exists.
     */

    activeFood =
      food;


    document.getElementById(
      "foodName"
    ).textContent =
      food;


    document.getElementById(
      "foodState"
    ).textContent =
      "SCANNING ACTIVE";

  } catch (error) {

    /*
     * Do not change the current display if
     * a refresh temporarily fails.
     *
     * This avoids flickering.
     */

    console.log(
      "Food refresh failed:",
      error
    );

  }

}


/*******************************************************
 * HANDLE BACKEND RESULT
 *******************************************************/

function handleResult(
  result,
  scannedId
) {

  if (
    !result ||
    !result.code
  ) {

    setStatus(
      "ERROR",
      "Unexpected server response.",
      "error"
    );


    playSound(
      "error"
    );


    return;

  }


  switch (
    result.code
  ) {


    /***********************************************
     * CHECK-IN
     ***********************************************/

    case "CHECK_IN_RECORDED":

      setStatus(
        "CHECK-IN SUCCESS",
        "Attendee checked in successfully.",
        "success"
      );


      showAttendee(
        result.attendeeId ||
          scannedId,

        result.attendeeName ||
          ""
      );


      updateLastScan(
        result.attendeeId ||
          scannedId
      );


      playSound(
        "success"
      );


      vibrate(
        80
      );


      break;


    /***********************************************
     * ALREADY CHECKED IN
     * NO FOOD COLUMN
     ***********************************************/

    case "CHECKED_IN_NO_FOOD":

      setStatus(
        "CHECKED IN",
        "No food service is currently active.",
        "warning"
      );


      showAttendee(
        result.attendeeId ||
          scannedId,

        result.attendeeName ||
          ""
      );


      updateLastScan(
        result.attendeeId ||
          scannedId
      );


      playSound(
        "warning"
      );


      vibrate(
        100
      );


      break;


    /***********************************************
     * FOOD RECORDED
     ***********************************************/

    case "FOOD_RECORDED":

      setStatus(
        "FOOD RECORDED",
        result.food +
          " recorded successfully.",
        "success"
      );


      showAttendee(
        result.attendeeId ||
          scannedId,

        result.attendeeName ||
          ""
      );


      updateLastScan(
        result.attendeeId ||
          scannedId
      );


      playSound(
        "success"
      );


      vibrate(
        [60, 50, 60]
      );


      break;


    /***********************************************
     * FOOD ALREADY RECORDED
     ***********************************************/

    case "FOOD_ALREADY_RECORDED":

      setStatus(
        "NOT ALLOWED",
        result.food +
          " is already recorded.",
        "warning"
      );


      showAttendee(
        result.attendeeId ||
          scannedId,

        result.attendeeName ||
          ""
      );


      updateLastScan(
        result.attendeeId ||
          scannedId
      );


      playSound(
        "warning"
      );


      vibrate(
        [100, 70, 100]
      );


      break;


    /***********************************************
     * ID NOT FOUND
     ***********************************************/

    case "ID_NOT_FOUND":

      setStatus(
        "NOT FOUND",
        "This attendee ID does not exist.",
        "error"
      );


      hideAttendee();


      playSound(
        "error"
      );


      vibrate(
        [100, 70, 100]
      );


      break;


    /***********************************************
     * SERVER BUSY
     ***********************************************/

    case "SERVER_BUSY":

      setStatus(
        "PLEASE RETRY",
        "Scanner server is busy.",
        "warning"
      );


      playSound(
        "warning"
      );


      break;


    /***********************************************
     * OTHER ERROR
     ***********************************************/

    default:

      setStatus(
        "NOT ALLOWED",
        result.message ||
          "Scan could not be processed.",
        "error"
      );


      playSound(
        "error"
      );


      vibrate(
        [100, 70, 100]
      );

  }

}


/*******************************************************
 * SEND SCAN
 *******************************************************/

async function processScan(
  rawId
) {

  const scannedId =
    cleanId(
      rawId
    );


  if (!scannedId) {

    return;

  }


  /*
   * Prevent camera from firing multiple requests
   * while one request is still being processed.
   */

  if (
    processing
  ) {

    return;

  }


  /*
   * Device-level cooldown.
   */

  const now =
    Date.now();


  if (
    scannedId ===
      lastScannedId &&

    (
      now -
      lastScanTime
    ) <
      LOCAL_COOLDOWN_MS
  ) {

    return;

  }


  lastScannedId =
    scannedId;


  lastScanTime =
    now;


  processing =
    true;


  hideAttendee();


  setStatus(
    "VERIFYING",
    "Checking attendee...",
    "processing"
  );


  try {

    const response =
      await fetch(
        SCRIPT_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              scannedId:
                scannedId

            })

        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    handleResult(
      result,
      scannedId
    );


  } catch (error) {

    console.error(
      error
    );


    setStatus(
      "CONNECTION ERROR",
      "Could not contact server. Please scan again.",
      "error"
    );


    playSound(
      "error"
    );


    vibrate(
      [100, 80, 100]
    );

  } finally {

    /*
     * Allow scanner to accept another QR.
     */

    setTimeout(
      function() {

        processing =
          false;

      },
      400
    );

  }

}


/*******************************************************
 * CAMERA SCAN
 *******************************************************/

function handleCameraScan(
  decodedText
) {

  processScan(
    decodedText
  );

}


/*******************************************************
 * MANUAL SUBMISSION
 *******************************************************/

function submitManualId() {

  const input =
    document.getElementById(
      "manualId"
    );


  const id =
    cleanId(
      input.value
    );


  if (!id) {

    setStatus(
      "ENTER ID",
      "Please enter an attendee ID.",
      "warning"
    );


    return;

  }


  input.value =
    "";


  processScan(
    id
  );

}


/*******************************************************
 * MANUAL ENTER KEY
 *******************************************************/

document
  .getElementById(
    "manualId"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        submitManualId();

      }

    }
  );


/*******************************************************
 * MANUAL BUTTON
 *******************************************************/

document
  .getElementById(
    "manualButton"
  )
  .addEventListener(
    "click",
    submitManualId
  );


/*******************************************************
 * START CAMERA
 *******************************************************/

function startScanner() {

  const scanner =
    new Html5Qrcode(
      "reader"
    );


  const config = {

    /*
     * 20 frames/sec gives good QR responsiveness
     * without unnecessarily hammering the phone.
     */

    fps:
      20,


    qrbox:
      function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.floor(
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) *
            0.72
          );


        return {

          width:
            size,

          height:
            size

        };

      },


    aspectRatio:
      1.0,


    disableFlip:
      false

  };


  scanner
    .start(

      {
        facingMode:
          "environment"
      },

      config,

      function(decodedText) {

        handleCameraScan(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * QR-not-found messages are normal.
         * Ignore them.
         */

      }

    )

    .catch(
      function(error) {

        console.error(
          error
        );


        setStatus(
          "CAMERA ERROR",
          "Camera could not be started. Check camera permission.",
          "error"
        );

      }
    );

}


/*******************************************************
 * INITIALIZE
 *******************************************************/

refreshFood();

startScanner();


/*******************************************************
 * PERIODIC FOOD HEADER REFRESH
 *******************************************************/

setInterval(
  refreshFood,
  FOOD_REFRESH_MS
);

</script>


</body>

</html>
